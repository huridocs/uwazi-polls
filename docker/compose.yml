# Infrastructure for a disposable Uwazi used by Playwright CI / local docker runs.
# Uwazi app itself is started by scripts/ci-up.sh from the official release tarball.

services:
  mongo:
    image: mongo:7.0
    command: ['mongod', '--replSet', 'uwazi_replica_set', '--bind_ip_all']
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --eval '
          try { rs.status() } catch (e) {
            rs.initiate({_id: "uwazi_replica_set", members: [{_id: 0, host: "localhost:27017"}]});
          }
        '

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.threshold_enabled=false
      - ingest.geoip.downloader.enabled=false
    ports:
      - '9200:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200 >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:6.0.19
    ports:
      - '6379:6379'

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: uwazi_development
    ports:
      - '5432:5432'

  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-02T17-50-41Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: uwazi
      MINIO_ROOT_PASSWORD: uwazipass
    ports:
      - '9000:9000'
      - '9001:9001'
