name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Unit tests (SM import/export mapping)
        run: yarn test:unit

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Start dockerized Uwazi + seed
        run: yarn ci:up
        # ci-up installs mongorestore if missing (required by yarn blank-state)

      - name: Run Playwright
        run: yarn test

      - name: Stop stack
        if: always()
        run: yarn ci:down

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            .uwazi/log/
          retention-days: 7
